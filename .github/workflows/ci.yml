name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Maven verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven verification
        run: mvn -B clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn

  docker-build:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t tech-challenge-oficina:ci .

      - name: Inspect API image
        run: docker image inspect tech-challenge-oficina:ci

  infra-validate:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.34.0"

      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform/local fmt -check -recursive

      - name: Initialize Terraform
        run: terraform -chdir=infra/terraform/local init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=infra/terraform/local validate

      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize k8s/local > /tmp/oficina-k8s.yaml
          test -s /tmp/oficina-k8s.yaml
