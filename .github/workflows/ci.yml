name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven verification
        run: mvn -B clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn

  docker-build:
    name: Docker build
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build -t tech-challenge-oficina:ci .

      - name: Inspect API image
        run: docker image inspect tech-challenge-oficina:ci

  infra-validate:
    name: Infrastructure validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.14.6"

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
        with:
          version: "v1.34.0"

      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform/local fmt -check -recursive

      - name: Initialize Terraform
        run: terraform -chdir=infra/terraform/local init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=infra/terraform/local validate

      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize k8s/local > /tmp/oficina-k8s.yaml
          test -s /tmp/oficina-k8s.yaml

      - name: Validate Kubernetes schemas offline from cluster
        run: |
          docker run --rm -i ghcr.io/yannh/kubeconform@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c \
            -strict -summary -kubernetes-version 1.34.0 < /tmp/oficina-k8s.yaml
