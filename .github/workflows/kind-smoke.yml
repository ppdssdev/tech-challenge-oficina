name: Kind Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLUSTER_NAME: oficina-local
  KIND_VERSION: v0.30.0
  IMAGE_NAME: tech-challenge-oficina:local

jobs:
  kind-smoke:
    name: Kind deployment and health check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.34.0"

      - name: Install Kind
        run: |
          curl --fail --show-error --silent --location \
            --output /tmp/kind-linux-amd64 \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl --fail --show-error --silent --location \
            --output /tmp/kind-linux-amd64.sha256sum \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          cd /tmp
          sha256sum --check kind-linux-amd64.sha256sum
          sudo install kind-linux-amd64 /usr/local/bin/kind
          kind version

      - name: Create Kind cluster
        run: kind create cluster --name "${CLUSTER_NAME}" --config k8s/kind/oficina-kind.yaml

      - name: Build API image
        run: docker build -t "${IMAGE_NAME}" .

      - name: Load API image into Kind
        run: kind load docker-image "${IMAGE_NAME}" --name "${CLUSTER_NAME}"

      - name: Apply Kubernetes manifests
        run: kubectl apply -k k8s/local

      - name: Wait for deployments
        run: |
          kubectl -n oficina rollout status deployment/oficina-postgres --timeout=180s
          kubectl -n oficina rollout status deployment/oficina-mailpit --timeout=180s
          kubectl -n oficina rollout status deployment/oficina-api --timeout=300s
          kubectl -n oficina rollout status deployment/oficina-prometheus --timeout=180s
          kubectl -n oficina rollout status deployment/oficina-grafana --timeout=180s

      - name: Validate API HPA resource
        run: kubectl -n oficina get hpa oficina-api-hpa

      - name: Validate API health and metrics
        run: |
          kubectl -n oficina port-forward service/oficina-api 8080:8080 \
            > /tmp/oficina-port-forward.log 2>&1 &
          echo "$!" > /tmp/oficina-port-forward.pid

          for attempt in {1..60}; do
            if curl --fail --show-error --silent \
              http://localhost:8080/actuator/health \
              --output /tmp/oficina-health.json; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "API health endpoint did not become available in time."
              exit 1
            fi
            sleep 5
          done

          grep -q '"status":"UP"' /tmp/oficina-health.json
          curl --fail --show-error --silent \
            http://localhost:8080/actuator/prometheus \
            --output /tmp/oficina-prometheus.txt
          test -s /tmp/oficina-prometheus.txt
          cat /tmp/oficina-health.json

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl -n oficina get pods -o wide || true
          kubectl -n oficina describe pods || true
          kubectl -n oficina logs deployment/oficina-api --all-containers=true --tail=200 || true
          kubectl -n oficina logs deployment/oficina-prometheus --all-containers=true --tail=100 || true
          kubectl -n oficina logs deployment/oficina-grafana --all-containers=true --tail=100 || true
          if [ -f /tmp/oficina-port-forward.log ]; then
            cat /tmp/oficina-port-forward.log
          fi

      - name: Delete Kind cluster
        if: always()
        run: |
          if [ -f /tmp/oficina-port-forward.pid ]; then
            kill "$(cat /tmp/oficina-port-forward.pid)" 2>/dev/null || true
          fi
          if command -v kind > /dev/null 2>&1; then
            kind delete cluster --name "${CLUSTER_NAME}"
          fi
