name: Staging observability validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'k8s/staging/observability/**'
      - 'scripts/staging/observability/**'
      - '.github/workflows/observability-validate.yml'
  push:
    branches: [main]
    paths:
      - 'k8s/staging/observability/**'
      - 'scripts/staging/observability/**'
      - '.github/workflows/observability-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.34.0
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.2
      - name: Validate manifests, policies, scripts and rollback without a cluster
        run: bash scripts/staging/observability/validate.sh
