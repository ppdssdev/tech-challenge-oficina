apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-prometheus-config
  namespace: oficina
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "oficina-api"
        metrics_path: "/actuator/prometheus"
        static_configs:
          - targets: ["oficina-api:8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-prometheus
  namespace: oficina
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-prometheus
  template:
    metadata:
      labels:
        app: oficina-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: oficina-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-prometheus
  namespace: oficina
spec:
  type: ClusterIP
  selector:
    app: oficina-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
