apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-mailpit
  namespace: oficina
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-mailpit
  template:
    metadata:
      labels:
        app: oficina-mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-mailpit
  namespace: oficina
spec:
  type: ClusterIP
  selector:
    app: oficina-mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
