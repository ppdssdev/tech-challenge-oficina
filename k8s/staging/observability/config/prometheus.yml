global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: oficina-api
  metrics_path: /actuator/prometheus
  sample_limit: 20000
  label_limit: 40
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - oficina-staging
    selectors:
    - role: pod
      label: app=oficina-api
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app
    action: keep
    regex: oficina-api
  - source_labels:
    - __meta_kubernetes_pod_phase
    action: keep
    regex: Running
  - source_labels:
    - __meta_kubernetes_pod_ready
    action: keep
    regex: 'true'
  - source_labels:
    - __meta_kubernetes_pod_container_port_number
    action: keep
    regex: '8080'
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    action: keep
    regex: http
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
