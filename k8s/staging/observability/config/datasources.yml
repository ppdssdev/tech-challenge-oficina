apiVersion: 1
datasources:
- name: Prometheus
  uid: prometheus
  type: prometheus
  access: proxy
  url: http://oficina-observability-prometheus:9090
  isDefault: true
  editable: false
  jsonData:
    timeInterval: 15s
- name: Tempo
  uid: tempo
  type: tempo
  access: proxy
  url: http://oficina-tempo:3200
  editable: false
  jsonData:
    httpMethod: GET
    nodeGraph:
      enabled: false
