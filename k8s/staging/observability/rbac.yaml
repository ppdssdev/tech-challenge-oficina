apiVersion: v1
kind: ServiceAccount
metadata:
  name: oficina-observability-prometheus
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oficina-observability-prometheus
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oficina-observability-prometheus
subjects:
- kind: ServiceAccount
  name: oficina-observability-prometheus
  namespace: oficina-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oficina-observability-prometheus
