apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-observability-tempo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oficina-observability-tempo
  template:
    metadata:
      labels:
        app: oficina-observability-tempo
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: tempo
        image: grafana/tempo:2.10.5@sha256:7be8586c0f25398428bb63c07db0a88283f073aa44c5f4a3be21e97fe83de502
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3200
        - name: otlp-http
          containerPort: 4318
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        volumeMounts:
        - name: data
          mountPath: /var/tempo
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/tempo
          readOnly: true
        args:
        - -config.file=/etc/tempo/tempo.yml
        - -target=all
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: oficina-observability-tempo
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: config
        configMap:
          name: oficina-observability-tempo
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-tempo
spec:
  type: ClusterIP
  selector:
    app: oficina-observability-tempo
  ports:
  - name: http
    port: 3200
    targetPort: http
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oficina-observability-tempo
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oficina-observability-tempo
spec:
  podSelector:
    matchLabels:
      app: oficina-observability-tempo
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: oficina-api
    ports:
    - protocol: TCP
      port: 4318
  - from:
    - podSelector:
        matchLabels:
          app: oficina-observability-grafana
    ports:
    - protocol: TCP
      port: 3200
