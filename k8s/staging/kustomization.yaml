apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oficina-staging
resources:
  - namespace.yaml
  - api.yaml
  - hpa.yaml
# The migration Job is deliberately applied and awaited separately before this Deployment.
  # A missing patch deliberately blocks direct application without a reviewed digest.
patches:
  - path: image-digest.yaml
