server:
  port: 8080

spring:
  application:
    name: oficina-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina_db}
    username: ${SPRING_DATASOURCE_USERNAME:oficina}
    password: ${SPRING_DATASOURCE_PASSWORD:oficina}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  notification:
    outbox:
      enabled: ${APP_NOTIFICATION_OUTBOX_ENABLED:true}
      poll-delay-ms: ${APP_NOTIFICATION_OUTBOX_POLL_DELAY_MS:5000}
      batch-size: ${APP_NOTIFICATION_OUTBOX_BATCH_SIZE:10}
      max-attempts: ${APP_NOTIFICATION_OUTBOX_MAX_ATTEMPTS:3}
      processing-timeout-seconds: ${APP_NOTIFICATION_OUTBOX_PROCESSING_TIMEOUT_SECONDS:300}
    email:
      from: ${APP_NOTIFICATION_EMAIL_FROM:oficina@local.test}
  jwt:
    secret: ${APP_JWT_SECRET:awssecretpostech-oficina-fiap-2026}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:120}
  admin:
    default-username: ${APP_ADMIN_DEFAULT_USERNAME:admin}
    default-password: ${APP_ADMIN_DEFAULT_PASSWORD:admin123}
