spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    mail:
      enabled: false
app:
  jwt:
    secret: ${APP_JWT_SECRET}
  admin:
    default-username: ${APP_ADMIN_DEFAULT_USERNAME}
    default-password: ${APP_ADMIN_DEFAULT_PASSWORD}
  notification:
    outbox:
      enabled: false
