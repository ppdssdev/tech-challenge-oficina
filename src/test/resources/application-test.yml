spring:
  datasource:
    url: jdbc:h2:mem:oficina;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-with-at-least-32-bytes-123456789
    expiration-minutes: 120
  admin:
    default-username: admin
    default-password: admin123
