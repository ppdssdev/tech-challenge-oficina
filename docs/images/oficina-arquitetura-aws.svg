<title id="title">Oficina — arquitetura AWS de staging</title><desc id="desc">Topologia de staging em us-east-2. Operador acessa EC2 com K3s via SSM. ECR fornece a imagem. API ClusterIP conecta ao RDS privado por TLS. Lambda usa leitura restrita de identidade. HPA escala de um a três pods em um nó. Observabilidade é definida no overlay. API Gateway público desabilitado; Lambda habilitada em janelas sintéticas.</desc>
