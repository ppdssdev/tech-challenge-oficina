<title id="title">Oficina — provisionamento e entrega na AWS</title><desc id="desc">Duas trilhas: infraestrutura Terraform em rede K3s, RDS e identidade; entrega com CI GitHub Actions, publicação manual ECR, migration Job e promoção manual K3s via SSM. State independente em S3. Flyway separado do runtime e imagem por digest.</desc>
